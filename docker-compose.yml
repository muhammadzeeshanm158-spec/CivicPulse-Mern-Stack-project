version: '3.8'
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: civicpulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend-dev
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: root123
      DB_NAME: civicpulse

  frontend:
    build: ./frontend-dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data: